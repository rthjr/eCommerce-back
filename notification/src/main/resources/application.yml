spring:
  application:
    name: notification
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    function:
      definition: orderCreated;orderStatusChanged;paymentEvent
    stream:
      bindings:
        orderCreated-in-0:
          destination: order.queue
          group: notification-group
        orderStatusChanged-in-0:
          destination: order.status.queue
          group: notification-group
        paymentEvent-in-0:
          destination: payment.events.queue
          group: notification-group
  mail:
    host: smtp.gmail.com
    port: 587
    username: "sovannarithphan9@gmail.com"
    password: "nibpunxqndzzwaxl"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"

server:
  port: 8084

rabbitmq:
  queue:
    name: order.queue
  exchange:
    name: order.exchange
  routing:
    key: order.tracking

app:
  email:
    from: "sovannarithphan9@gmail.com"
  user-service:
    url: ${USER_SERVICE_URL:http://localhost:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    com.ecommerce.notification: DEBUG
    org.springframework.cloud.stream: DEBUG
    org.springframework.amqp: DEBUG
