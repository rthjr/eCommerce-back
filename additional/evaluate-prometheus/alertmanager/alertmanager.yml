global:
  resolve_timeout: 1m

route:
  receiver: correlation-service
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 5m

receivers:
  - name: correlation-service
    webhook_configs:
      - url: http://correlation:8091/api/alert
        send_resolved: true
