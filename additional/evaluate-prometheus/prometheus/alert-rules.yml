groups:
  - name: ecom-correlation-alerts
    rules:
      - alert: ServiceDown
        expr: up{service!=""} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus target for service {{ $labels.service }} is unreachable."

      - alert: HighHttpP95Latency
        expr: histogram_quantile(0.95, sum by (le, service) (rate(http_server_requests_seconds_bucket{service!=""}[5m]))) > 1.5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency for {{ $labels.service }}"
          description: "p95 latency crossed 1.5s for service {{ $labels.service }}."
