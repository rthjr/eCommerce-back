global:
  scrape_interval: 3s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'product-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          application: 'product-service'
          service: 'product-service'

  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          application: 'user-service'
          service: 'user-service'

  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          application: 'order-service'
          service: 'order-service'

  - job_name: 'payment-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8976']
        labels:
          application: 'payment-service'
          service: 'payment-service'

  - job_name: 'notification'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
        labels:
          application: 'notification'
          service: 'notification'

  - job_name: 'payment-service-java'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8089']
        labels:
          application: 'payment-service-java'
          service: 'payment-service-java'

  - job_name: 'correlation-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['correlation:8091']
        labels:
          application: 'correlation-service'
          service: 'correlation-service'
