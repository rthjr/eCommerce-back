---
server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100

memberlist:
  join_members: ["read", "write", "backend"]
  dead_node_reclaim_time: 30s
  gossip_to_dead_nodes_time: 15s
  left_ingesters_timeout: 30s
  bind_addr: ['0.0.0.0']
  bind_port: 7946
  gossip_interval: 2s

schema_config:
  configs:
    - from: 2023-01-01
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
common:
  path_prefix: /loki
  replication_factor: 1
  compactor_address: http://backend:3100
  storage:
    s3:
      endpoint: minio:9000
      insecure: true
      bucketnames: loki-data
      access_key_id: loki
      secret_access_key: supersecret
      s3forcepathstyle: true
  ring:
    kvstore:
      store: memberlist
ruler:
  storage:
    s3:
      bucketnames: loki-ruler

compactor:
  working_directory: /tmp/compactor
  # Enable compactor to enforce retention deletion
  retention_enabled: true
  # Run compaction every 10 minutes
  compaction_interval: 10m
  # Delete chunks older than retention after they are already compacted
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# -------------------------------------------------------
# Retention: keep logs for 1 day only
# -------------------------------------------------------
limits_config:
  retention_period: 24h
  # Maximum time range a query can span (prevents runaway queries)
  max_query_length: 25h

# -------------------------------------------------------
# Query caching: cache results for up to 1 day
# -------------------------------------------------------
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        # Max memory the cache can use (MB)
        max_size_mb: 100
        # Evict cache entries older than 1 day
        ttl: 24h
  cache_results: true