  rabbitmq:
    connection-timeout: ${CONNECTION_TIMEOUT:30000}
    addresses: amqps://exnddjpl:t2JWuxv4dfjNPSCw-L9V9519lSM2DMSG@cougar.rmq.cloudamqp.com/exnddjpl
  jpa:
    database: POSTGRESQL
