services:
  postgres:
    container_name: postgres_container
    image: postgres:14
    environment:
      POSTGRES_USER: embarkx
      POSTGRES_PASSWORD: embarkx
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - "5432:5432"
    networks:
      - backend
    restart: unless-stopped
  pgadmin:
    container_name: pgadmin_container
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin4@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - "5050:80"
    networks:
      - backend
    restart: unless-stopped

  rabbitmq:
    container_name: rabbitmq_container
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"   # RabbitMQ Message Broker
      - "15672:15672" # RabbitMQ Management UI (http://localhost:15672)
    networks:
      - backend
    restart: unless-stopped

  notification:
    build:
      context: ./notification
      dockerfile: Dockerfile
    container_name: notification_service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      USER_SERVICE_URL: http://host.docker.internal:8082
      EUREKA_CLIENT_ENABLED: "false"
      SPRING_CLOUD_DISCOVERY_ENABLED: "false"
    ports:
      - "8084:8084"
    depends_on:
      - rabbitmq
      - zipkin
    networks:
      - backend
    restart: unless-stopped
    profiles:
      - local-observability

  payment-gateway:
    build:
      context: ./payment-gateway
      dockerfile: Dockerfile
    container_name: payment_gateway
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      OTEL_SERVICE_NAME: payment-gateway
    ports:
      - "8976:8976"
    depends_on:
      - rabbitmq
      - zipkin
    networks:
      - backend
    restart: unless-stopped
    profiles:
      - local-observability

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "9411:9411"
    networks:
      - backend
    restart: unless-stopped
    profiles:
      - local-observability

  correlation:
    build:
      context: ./correlation
      dockerfile: Dockerfile
    container_name: correlation_service
    environment:
      PROMETHEUS_BASE_URL: ${PROMETHEUS_BASE_URL:-http://host.docker.internal:9090}
      LOKI_BASE_URL: ${LOKI_BASE_URL:-http://host.docker.internal:3100}
      ZIPKIN_BASE_URL: ${ZIPKIN_BASE_URL:-http://zipkin:9411}
      GRAFANA_DASHBOARD_URL: ${GRAFANA_DASHBOARD_URL:-http://host.docker.internal:3000/d/correlation}
    ports:
      - "8091:8091"
    depends_on:
      - zipkin
    networks:
      - backend
    restart: unless-stopped
    profiles:
      - local-observability
networks:
  backend:
    driver: bridge

volumes:
  postgres:
  pgadmin:
