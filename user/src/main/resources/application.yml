spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888
  mail:
    host: smtp.gmail.com
    port: 587
    username: "sovannarithphan9@gmail.com"
    password: "wdqugcibbpbrqdkk"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
    test-connection: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8082/oauth2/callback/google}
            scope: email,profile
            authorization-grant-type: authorization_code
          github:
            client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
            redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8082/oauth2/callback/github}
            scope: user:email
            authorization-grant-type: authorization_code
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID:your-facebook-client-id}
            client-secret: ${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
            redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:8082/oauth2/callback/facebook}
            scope: email,public_profile
            authorization-grant-type: authorization_code
        provider:
          google:
            user-info-uri: https://www.googleapis.com/oauth2/v4/userinfo
            user-name-attribute: sub
          github:
            user-info-uri: https://api.github.com/user
            user-name-attribute: id
          facebook:
            user-info-uri: https://graph.facebook.com/me
            user-name-attribute: id

app:
  email:
    from: "sovannarithphan9@gmail.com"
    async-enabled: true
  password-reset:
    code-expiry-minutes: 10
    resend-cooldown-seconds: 60
  security:
    pepper: "MySecure-Pepper-Key-2024"
    expose-email-errors: false

jwt:
  secret: your-256-bit-secret-key-here-at-least-32-characters-long-and-secure
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 2592000000

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
    client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8082/oauth2/callback/google}
    api-uri: https://www.googleapis.com/oauth2/v4/userinfo
  github:
    client-id: ${GITHUB_CLIENT_ID:your-github-client-id}
    client-secret: ${GITHUB_CLIENT_SECRET:your-github-client-secret}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8082/oauth2/callback/github}
    api-uri: https://api.github.com/user
  facebook:
    client-id: ${FACEBOOK_CLIENT_ID:your-facebook-client-id}
    client-secret: ${FACEBOOK_CLIENT_SECRET:your-facebook-client-secret}
    redirect-uri: ${FACEBOOK_REDIRECT_URI:http://localhost:8082/oauth2/callback/facebook}
    api-uri: https://graph.facebook.com/me

logging:
  level:
    com.ecommerce.user.services.EmailService: DEBUG
    org.springframework.mail: DEBUG
